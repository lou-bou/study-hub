<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%PAGETITLE%%</title>
<script>/* study-hub:theme */(function(){var r=document.documentElement;try{var t=localStorage.getItem("studyhub-theme");if(t)r.setAttribute("data-theme",t);}catch(e){}document.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("theme-toggle");if(b)b.addEventListener("click",function(){var c=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var n=c==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("studyhub-theme",n);}catch(e){}});});})();</script>
<style>
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font:var(--text-md)/var(--leading-body) var(--font-body)}
  a{color:var(--link);text-underline-offset:2px}
  a,button,label,summary,input,select{touch-action:manipulation}
  a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  [hidden]{display:none!important}
  .i{width:20px;height:20px;flex-shrink:0}
  .ribbon{flex-shrink:0;width:9px;height:22px;fill:var(--accent)}
  .ribbon.outline{fill:none;stroke:var(--text-muted);stroke-width:7}
  .code{font:400 var(--text-xs) var(--font-mono);color:var(--text-muted)}
  .label{font:600 var(--text-xs)/1.3 var(--font-body);color:var(--text-muted)}

  /* shell: sidebar on desktop (assets/sidebar.css); top bar and bottom nav on phones */
  .brand{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3) var(--space-4);text-decoration:none;color:var(--text);font:600 var(--text-lg)/1.15 var(--font-display);font-variation-settings:"opsz" 72;letter-spacing:-.01em}
  .brand img{width:30px;height:30px}
  .topbar{display:none;position:sticky;top:0;z-index:20;align-items:center;gap:var(--space-2);height:56px;padding:0 var(--space-2) 0 var(--space-4);background:var(--bg);border-bottom:1px solid var(--border)}
  .topbar .brand{padding:0;margin-right:auto;font-size:var(--text-lg)}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:var(--radius-sm);background:none;color:var(--text);cursor:pointer;text-decoration:none}
  .tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--border)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;color:var(--text-muted);font:400 var(--text-xs)/1.2 var(--font-body);text-decoration:none}
  .tab.on{color:var(--text);font-weight:600}
  .page{margin-left:16rem;padding:var(--space-6) var(--space-6) var(--space-8)}
  .page-in{max-width:52rem;margin-inline:auto}

  /* page head */
  .hero{display:flex;align-items:flex-start;gap:var(--space-5);padding-bottom:var(--space-5)}
  .hero-text{flex:1;min-width:0}
  .eyebrow{font:600 var(--text-xs)/1.3 var(--font-body);color:var(--text-muted)}
  h1{font-family:var(--font-display);font-weight:600;font-variation-settings:"opsz" 72;font-size:clamp(1.875rem,4.4vw,var(--text-2xl));line-height:1.12;letter-spacing:-.01em;margin:var(--space-1) 0 var(--space-2);text-wrap:balance}
  .hero p{margin:0;color:var(--text-muted);max-width:var(--measure)}
  h2.section{margin:var(--space-6) 0 var(--space-3);font:600 var(--text-lg)/1.2 var(--font-display)}

  /* buttons */
  .pbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font:600 var(--text-sm) var(--font-body);text-decoration:none;white-space:nowrap;cursor:pointer;transition:background var(--dur-fast) var(--ease-out)}
  .btn{min-height:44px;padding:10px var(--space-5);border:0;border-radius:var(--radius-sm);background:var(--primary);color:var(--on-primary);font:600 var(--text-sm) var(--font-body);cursor:pointer;justify-self:start}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.sm{min-height:36px;padding:6px 18px}

  /* progress */
  .pg{display:flex;align-items:center;gap:10px;color:var(--text-muted);font:400 var(--text-xs) var(--font-mono)}
  .pg-track{flex:1;min-width:48px;height:6px;border-radius:var(--radius-sm);background:var(--surface-2);overflow:hidden}
  .pg-fill{display:block;height:100%;width:0;background:var(--accent);transition:width var(--dur-med) var(--ease-out)}

  /* home: the Continue card */
  .continue{display:flex;gap:var(--space-4);padding:var(--space-5);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text);text-decoration:none;transition:background var(--dur-fast) var(--ease-out)}
  .continue .ribbon{width:13px;height:32px;margin-top:2px}
  .continue-main{flex:1;min-width:0;display:grid;gap:var(--space-1)}
  .continue h2{margin:0;font:600 var(--text-xl)/1.15 var(--font-display)}
  .continue .sec-title{font-weight:600}
  .continue .pg{margin-top:var(--space-2)}
  .continue .from{color:var(--text-muted);font-size:var(--text-xs)}
  .empty-card{padding:var(--space-5);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-muted)}

  /* course grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-3)}
  a.card{display:flex;flex-direction:column;gap:var(--space-1);min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-4);text-decoration:none;color:var(--text);transition:background var(--dur-fast) var(--ease-out)}
  .card h3{margin:0;font:600 var(--text-lg)/1.2 var(--font-display);overflow-wrap:anywhere}
  .blurb{margin:0;color:var(--text-muted);font-size:var(--text-sm);line-height:1.4}
  a.card .pg{margin-top:auto;padding-top:var(--space-3)}
  .hero .pg{margin-top:var(--space-3)}

  /* course page: tabs and rows */
  .chapters{display:grid;gap:var(--space-3)}
  .chapter{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;scroll-margin-top:var(--space-4)}
  .chapter>summary{display:flex;align-items:center;gap:var(--space-3);min-height:60px;padding:var(--space-3) var(--space-4);cursor:pointer;list-style:none;transition:background var(--dur-fast) var(--ease-out)}
  .chapter>summary::-webkit-details-marker{display:none}
  .chapter>summary:focus-visible{outline-offset:-2px}
  .chapter>summary .i{color:var(--text-muted);transition:transform var(--dur-fast) var(--ease-out)}
  .chapter[open]>summary .i{transform:rotate(180deg)}
  .chapter-name{flex:1;min-width:0;font:500 var(--text-lg)/1.25 var(--font-display);overflow-wrap:anywhere}
  .chapter-name .label{display:block;margin-bottom:2px}
  .chapter .row-wrap{border-top:1px solid var(--border)}
  .rows{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
  .row-wrap{display:flex;align-items:center}
  .row-wrap+.row-wrap{border-top:1px solid var(--border)}
  a.row{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-3);min-height:52px;padding:var(--space-2) var(--space-4);color:var(--text);text-decoration:none;transition:background var(--dur-fast) var(--ease-out)}
  .row-name{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3}
  .row-name small{display:block;color:var(--text-muted);font-size:var(--text-xs)}
  .row-meta{flex-shrink:0;color:var(--text-muted);font:400 var(--text-xs) var(--font-mono);white-space:nowrap}
  .status{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:20px;height:22px;color:var(--text-muted)}
  .status.done{color:var(--correct)}
  .offline-btn{flex-shrink:0;width:44px;height:44px;margin-right:var(--space-1);display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--radius-sm);background:none;cursor:pointer}
  .row-sub{margin:0;padding:var(--space-3) var(--space-4) var(--space-1);border-top:1px solid var(--border)}
  .none{padding:var(--space-4);color:var(--text-muted);font-size:var(--text-sm)}

  /* search */
  .search-box{width:100%;min-height:44px;padding:0 var(--space-3);font:var(--text-md) var(--font-body);color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
  .hit{display:block;padding:var(--space-3) var(--space-4);color:var(--text);text-decoration:none}
  .hit+.hit{border-top:1px solid var(--border)}
  .hit b{font-weight:600}
  .hit .snip{display:block;color:var(--text-muted);font-size:var(--text-sm);line-height:1.4}
  .hit mark{background:var(--surface-2);color:inherit;font-weight:600}

  /* manage page */
  .up{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-3)}
  .up fieldset{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);padding:var(--space-4);margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-3);min-width:0}
  .up legend{float:left;width:100%;padding:0 0 var(--space-1);font:600 var(--text-xs) var(--font-body);color:var(--text-muted)}
  .up .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-3)}
  .up label.f{display:grid;gap:var(--space-1);font-size:var(--text-xs);font-weight:600;color:var(--text-muted)}
  .up input[type=text],.up select{font:inherit;font-size:var(--text-sm);font-weight:400;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 var(--space-3);min-height:44px;width:100%}
  .kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:3px;background:var(--surface-2);border-radius:var(--radius-md)}
  .kinds label{position:relative;display:flex;align-items:center;justify-content:center;min-height:36px;padding:var(--space-1) 6px;border-radius:var(--radius-sm);border:1px solid transparent;color:var(--text-muted);font-size:var(--text-xs);font-weight:600;text-align:center;cursor:pointer}
  .kinds label:has(input:checked){background:var(--surface);border-color:var(--border);color:var(--text)}
  .kinds input{position:absolute;opacity:0;pointer-events:none}
  .drop{display:block;border:1px dashed var(--border);border-radius:var(--radius-md);padding:var(--space-5) var(--space-4);text-align:center;color:var(--text-muted);font-size:var(--text-sm);cursor:pointer}
  .drop.over{border-color:var(--focus);background:var(--surface-2);color:var(--text)}
  .drop input{display:block;margin:10px auto 0;max-width:100%;min-width:0;font-size:var(--text-xs)}
  .drop input::file-selector-button{margin-right:10px;min-height:36px;padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font:600 var(--text-xs) var(--font-body);cursor:pointer}
  .hint{font-size:var(--text-xs);color:var(--text-muted);margin:0}
  .err{color:var(--wrong);font-size:var(--text-sm);margin:0}
  .jobs{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
  .jobs:empty{display:none}
  .jobs li{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);display:grid;gap:2px;overflow-wrap:anywhere;font-size:var(--text-sm)}
  .jobs li.ok{background:var(--correct-bg);border-color:transparent}
  .jobs li.bad{background:var(--wrong-bg);border-color:transparent}
  .jobs .st{font-size:var(--text-xs);color:var(--text-muted)}
  .jobs li.ok .st{color:var(--correct)}
  .jobs li.bad .st{color:var(--wrong)}
  .jobs ul{margin:var(--space-1) 0 0;padding-left:1.2em;color:var(--wrong);font-size:var(--text-xs)}
  .manage{display:grid;gap:var(--space-2);padding-top:var(--space-5)}
  .manage h2{margin:0;font:600 var(--text-xl)/1.15 var(--font-display)}
  #tree{display:grid;gap:var(--space-3);margin-top:var(--space-1)}
  details.mod{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
  details.mod>summary{cursor:pointer;display:flex;align-items:center;gap:10px;min-height:52px;padding:var(--space-2) var(--space-4);font-weight:600;font-size:var(--text-sm)}
  details.mod .chip{font:400 var(--text-xs) var(--font-mono);color:var(--text-muted)}
  .tree-ch{border-top:1px solid var(--border);padding:var(--space-3) var(--space-4)}
  .tree-h{display:flex;align-items:center;gap:var(--space-2);font-weight:600;font-size:var(--text-sm)}
  .tree-h>span:first-child{min-width:0}
  .tree-ch ul{list-style:none;margin:6px 0 0;padding:0}
  .tree-ch li{display:flex;align-items:center;gap:var(--space-2);padding:6px 0;font-size:var(--text-xs);overflow-wrap:anywhere;min-width:0}
  .tree-ch li+li{border-top:1px solid var(--border)}
  .ft{flex-shrink:0;font:400 11px var(--font-mono);color:var(--text-muted)}
  .edt,.del{flex-shrink:0;min-height:32px;padding:var(--space-1) var(--space-3);border-radius:var(--radius-sm);font:600 var(--text-xs) var(--font-body);cursor:pointer}
  .edt{margin-left:auto;color:var(--text);background:var(--surface);border:1px solid var(--border)}
  .del{margin-left:auto;color:var(--wrong);background:var(--wrong-bg);border:1px solid transparent}
  .edt+.del{margin-left:0}
  .del:disabled{opacity:.4;cursor:default}
  .edit-form{display:grid;gap:10px;margin:0 var(--space-4) var(--space-4);padding:var(--space-4);border-radius:var(--radius-sm);background:var(--surface-2)}
  .tree-ch .edit-form{margin:10px 0 var(--space-1)}
  .edit-actions{display:flex;gap:var(--space-2);align-items:center}

  @media (hover:hover){
    .chapter>summary:hover,.pbtn:hover,.edt:hover,a.card:hover,a.row:hover,.continue:hover,.hit:hover,.offline-btn:hover,.icon-btn:hover{background:var(--surface-2)}
    .btn:hover:not(:disabled){opacity:.88}
    .del:hover{border-color:var(--wrong)}
    .drop:hover{border-color:var(--text-muted)}
  }
  @media (max-width:700px){
    .topbar{display:flex}
    .tabs{display:flex}
    .page{margin-left:0;padding:var(--space-4) var(--space-4) calc(60px + var(--space-6) + env(safe-area-inset-bottom,0px))}
    .grid{grid-template-columns:minmax(0,1fr)}
    .pbtn{min-height:44px}
    .btn{width:100%}
    .btn.sm{width:auto;min-height:44px}
    .continue{padding:var(--space-4)}
    .kinds{grid-template-columns:repeat(2,minmax(0,1fr))}
    .kinds label{min-height:44px}
    .up input[type=text],.up select{font-size:16px}
    .search-box{font-size:16px}
    details.mod>summary,.tree-h,.tree-ch li{flex-wrap:wrap}
    .edt,.del{min-height:40px;padding-inline:14px}
  }
</style>
</head>
<body%%BODYATTR%%>
%%SIDE%%
<header class="topbar">
  <a class="brand" href="/"><img src="/assets/logo.svg" alt="">%%SITENAME%%</a>
  <button class="icon-btn" id="theme-tab" type="button" aria-label="Toggle light or dark theme">%%ICON_THEME%%</button>
</header>
<div class="page"><div class="page-in">
  %%HEAD%%
%%MAIN%%
</div></div>
<nav class="tabs" aria-label="Main">%%TABS%%</nav>
%%CATALOG%%
<script>document.getElementById("theme-tab").addEventListener("click",function(){document.getElementById("theme-toggle").click();});</script>
<script src="%%JS_HUB%%"></script>
</body>
</html>
