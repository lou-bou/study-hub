<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<script>
  try { var t = localStorage.getItem("hub-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
  :root {
    --bg: #faf8f3; --surface: #ffffff; --ink: #1f2430; --muted: #5d6475; --line: #e4e0d6;
    --accent: #2f6fdb; --accent-soft: #e6eefc; --practice: #b4531f; --practice-soft: #fbeadf;
    --chip-bg: #1f2430; --chip-ink: #faf8f3; --shadow: 0 1px 2px rgba(31,36,48,.06), 0 4px 16px rgba(31,36,48,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c; --surface: #1c1f27; --ink: #e8e6e1; --muted: #9aa1b2; --line: #2c303b;
      --accent: #7aa7ff; --accent-soft: #1f2a42; --practice: #f0a070; --practice-soft: #3a261b;
      --chip-bg: #e8e6e1; --chip-ink: #14161c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --surface: #1c1f27; --ink: #e8e6e1; --muted: #9aa1b2; --line: #2c303b;
    --accent: #7aa7ff; --accent-soft: #1f2a42; --practice: #f0a070; --practice-soft: #3a261b;
    --chip-bg: #e8e6e1; --chip-ink: #14161c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  .topbar { display: flex; justify-content: flex-end; padding-top: 16px; }
  .toggle {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .hero {
    display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center;
    padding: 24px 0 32px; border-bottom: 1px solid var(--line);
  }
  .hero h1 {
    margin: 0 0 6px; font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: clamp(30px, 6vw, 46px); line-height: 1.1; letter-spacing: -.01em;
  }
  .hero p { margin: 0 0 16px; color: var(--muted); font-size: 18px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 14px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .figure { width: 190px; height: auto; color: var(--ink); }
  .figure .e { stroke: var(--muted); stroke-width: 2; }
  .figure .hl { stroke: var(--accent); stroke-width: 3; }
  .figure .n { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
  .figure .na { fill: var(--accent); stroke: var(--accent); }
  .figure text { font: 600 12px system-ui, sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .figure .na + text { fill: var(--surface); }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px; padding: 28px 0 80px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .chip {
    background: var(--chip-bg); color: var(--chip-ink); border-radius: 6px; padding: 2px 8px;
    font: 700 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em;
    flex-shrink: 0;
  }
  .card h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 20px; line-height: 1.25; overflow-wrap: anywhere; }
  .blurb { margin: 0; color: var(--muted); font-size: 15px; }
  .pages { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .page {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px;
    text-decoration: none; color: var(--ink); background: var(--accent-soft); min-width: 0;
  }
  .page:hover, .page:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .page.practice { background: var(--practice-soft); }
  .page.practice:hover, .page.practice:focus-visible { outline-color: var(--practice); }
  .kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); flex-shrink: 0; width: 76px; }
  .practice .kind { color: var(--practice); }
  .pt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .badge {
    flex-shrink: 0; font-size: 12px; font-weight: 600; color: var(--practice);
    border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }
  .empty { color: var(--muted); }
  @media (max-width: 560px) {
    .hero { grid-template-columns: 1fr; }
    .figure { width: 140px; order: -1; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><button class="toggle" id="theme-toggle" type="button" aria-label="Toggle theme">◐ Theme</button></div>
  <header class="hero">
    <div>
      <h1>%%TITLE%%</h1>
      <p>%%SUB%%</p>
      <div class="stats">%%STATS%%</div>
    </div>
    <svg class="figure" viewBox="0 0 200 150" role="img" aria-label="A small graph">
      <line class="e" x1="40" y1="40" x2="110" y2="25"/>
      <line class="e" x1="40" y1="40" x2="60" y2="115"/>
      <line class="hl" x1="110" y1="25" x2="165" y2="75"/>
      <line class="e" x1="60" y1="115" x2="135" y2="125"/>
      <line class="hl" x1="165" y1="75" x2="135" y2="125"/>
      <line class="e" x1="110" y1="25" x2="60" y2="115"/>
      <circle class="n" cx="40" cy="40" r="14"/><text x="40" y="40">a</text>
      <circle class="n na" cx="110" cy="25" r="14"/><text x="110" y="25">b</text>
      <circle class="n na" cx="165" cy="75" r="14"/><text x="165" y="75">c</text>
      <circle class="n" cx="60" cy="115" r="14"/><text x="60" y="115">d</text>
      <circle class="n na" cx="135" cy="125" r="14"/><text x="135" y="125">e</text>
    </svg>
  </header>
  <main class="grid">
%%CARDS%%
  </main>
</div>
<script>
(function () {
  var root = document.documentElement;
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("hub-theme", next); } catch (e) {}
  });

  fetch("/api/summary", { cache: "no-store", credentials: "same-origin" })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (counts) {
      var total = 0;
      Object.keys(counts).forEach(function (k) { total += counts[k]; });
      var t = document.getElementById("saved-total");
      if (t) t.textContent = total;
      var w = document.getElementById("saved-word");
      if (w) w.textContent = total === 1 ? "answer" : "answers";
      document.querySelectorAll("a.practice[data-key]").forEach(function (a) {
        var n = counts[a.getAttribute("data-key")];
        if (!n) return;
        var b = a.querySelector(".badge");
        b.textContent = n + " saved";
        b.hidden = false;
      });
    })
    .catch(function () {});
})();
</script>
</body>
</html>
