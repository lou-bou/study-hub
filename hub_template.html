<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script>/* study-hub:theme */(function(){var r=document.documentElement;try{var t=localStorage.getItem("studyhub-theme");if(t)r.setAttribute("data-theme",t);}catch(e){}document.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("theme-toggle");if(b)b.addEventListener("click",function(){var c=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var n=c==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("studyhub-theme",n);}catch(e){}});});})();</script>
<style>
  :root{
    --bg:#F3F5FB; --surface:#FFFFFF; --ink:#14203B; --muted:#586583; --line:#D9DFEC;
    --accent:#2B52E6; --accent-soft:#E3E9FF; --hi:#D9481C; --hi-soft:#FFE3D6; --code-bg:#E9EDF8;
    --f-display:'Bricolage Grotesque',system-ui,sans-serif;
    --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1426; --surface:#151F38; --ink:#E6EBF8; --muted:#9BA8C7; --line:#28345A;
      --accent:#8AA5FF; --accent-soft:#1B2958; --hi:#FF8D63; --hi-soft:#47281F; --code-bg:#1C2849;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1426; --surface:#151F38; --ink:#E6EBF8; --muted:#9BA8C7; --line:#28345A;
    --accent:#8AA5FF; --accent-soft:#1B2958; --hi:#FF8D63; --hi-soft:#47281F; --code-bg:#1C2849;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);padding:28px 16px 72px}
  .wrap{max-width:1040px;margin:0 auto}
  a{color:var(--accent)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
  .toggle{position:fixed;top:14px;right:14px;z-index:20;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 .8rem var(--f-body);cursor:pointer}
  .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center;padding-bottom:32px;border-bottom:1px solid var(--line)}
  .eyebrow{font:600 .75rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.3rem,5.4vw,3.6rem);line-height:1.02;letter-spacing:-.025em;margin:14px 0 12px}
  .hero p{margin:0 0 18px;color:var(--muted);font-size:1.1rem}
  .stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font:500 .85rem var(--f-mono)}
  .stats b{color:var(--ink)}
  .figure{width:200px;height:auto}
  .figure .e{stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
  .figure .hl{stroke:var(--accent);stroke-width:3.6;stroke-linecap:round}
  .figure .n{fill:var(--surface);stroke:var(--ink);stroke-width:1.8}
  .figure .na{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.6}
  .figure text{font:500 12.5px var(--f-mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding-top:28px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:16px}
  .card-head{display:flex;align-items:center;gap:10px}
  .chip{background:var(--accent);color:var(--surface);border-radius:6px;padding:2px 8px;font:600 .75rem/1.6 var(--f-mono);letter-spacing:.06em;flex-shrink:0}
  .card h2{margin:0;font:700 1.3rem/1.2 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
  .blurb{margin:0;color:var(--muted);font-size:.95rem}
  .chapters{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:12px}
  .chapter{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
  .ch-h{font-size:.95rem;line-height:1.35}
  .cl{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-right:6px}
  .ct{font-weight:600}
  .pgs{display:flex;flex-wrap:wrap;gap:8px}
  .pg{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.9rem;background:var(--accent-soft);color:var(--accent)}
  .pg.practice{background:var(--hi-soft);color:var(--hi)}
  .pg:hover{outline:2px solid currentColor;outline-offset:-2px}
  .badge{font:500 .72rem var(--f-mono);border:1px solid currentColor;border-radius:999px;padding:0 7px}
  .docs{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:.88rem}
  .dk{font:600 .68rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:3.6em}
  .doc{text-decoration:none;color:var(--ink);display:inline-flex;gap:6px;align-items:baseline}
  .doc:hover{color:var(--accent);text-decoration:underline}
  .ft{font:600 .62rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .none{color:var(--muted);font-style:italic;font-size:.85rem}
  .empty{color:var(--muted)}
  @media (max-width:600px){
    body{padding-top:60px}
    .hero{grid-template-columns:1fr}
    .figure{width:150px;order:-1}
    .grid{grid-template-columns:minmax(0,1fr)}
  }
</style>
</head>
<body>
<button class="toggle" id="theme-toggle" type="button" aria-label="Toggle light or dark theme">◐ Theme</button>
<div class="wrap">
  <header class="hero">
    <div>
      <div class="eyebrow">Master Big Data Analytics · USTHB</div>
      <h1>%%TITLE%%</h1>
      <p>%%SUB%%</p>
      <div class="stats">%%STATS%%</div>
    </div>
    <svg class="figure" viewBox="0 0 200 150" role="img" aria-label="A small graph">
      <line class="e" x1="40" y1="40" x2="110" y2="25"/>
      <line class="e" x1="40" y1="40" x2="60" y2="115"/>
      <line class="hl" x1="110" y1="25" x2="165" y2="75"/>
      <line class="e" x1="60" y1="115" x2="135" y2="125"/>
      <line class="hl" x1="165" y1="75" x2="135" y2="125"/>
      <line class="e" x1="110" y1="25" x2="60" y2="115"/>
      <circle class="n" cx="40" cy="40" r="14"/><text x="40" y="40">a</text>
      <circle class="n na" cx="110" cy="25" r="14"/><text x="110" y="25">b</text>
      <circle class="n na" cx="165" cy="75" r="14"/><text x="165" y="75">c</text>
      <circle class="n" cx="60" cy="115" r="14"/><text x="60" y="115">d</text>
      <circle class="n na" cx="135" cy="125" r="14"/><text x="135" y="125">e</text>
    </svg>
  </header>
  <main class="grid">
%%CARDS%%
  </main>
</div>
<script>
fetch("/api/summary", { cache: "no-store", credentials: "same-origin" })
  .then(function (r) { if (!r.ok) throw 0; return r.json(); })
  .then(function (counts) {
    var total = 0;
    Object.keys(counts).forEach(function (k) { total += counts[k]; });
    document.getElementById("saved-total").textContent = total;
    document.getElementById("saved-word").textContent = total === 1 ? "answer" : "answers";
    document.querySelectorAll("a.practice[data-key]").forEach(function (a) {
      var n = counts[a.getAttribute("data-key")];
      if (!n) return;
      var b = a.querySelector(".badge");
      b.textContent = n + " saved";
      b.hidden = false;
    });
  })
  .catch(function () {});
</script>
</body>
</html>
