<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%PAGETITLE%%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script>/* study-hub:theme */(function(){var r=document.documentElement;try{var t=localStorage.getItem("studyhub-theme");if(t)r.setAttribute("data-theme",t);}catch(e){}document.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("theme-toggle");if(b)b.addEventListener("click",function(){var c=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var n=c==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("studyhub-theme",n);}catch(e){}});});})();</script>
<style>
  :root{
    --bg:#F3F5FB; --surface:#FFFFFF; --ink:#14203B; --muted:#586583; --line:#D9DFEC;
    --accent:#2B52E6; --accent-soft:#E3E9FF; --hi:#D9481C; --hi-soft:#FFE3D6; --code-bg:#E9EDF8; --ok:#1B7A49;
    --f-display:'Bricolage Grotesque',system-ui,sans-serif;
    --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1426; --surface:#151F38; --ink:#E6EBF8; --muted:#9BA8C7; --line:#28345A;
      --accent:#8AA5FF; --accent-soft:#1B2958; --hi:#FF8D63; --hi-soft:#47281F; --code-bg:#1C2849; --ok:#5FD394;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1426; --surface:#151F38; --ink:#E6EBF8; --muted:#9BA8C7; --line:#28345A;
    --accent:#8AA5FF; --accent-soft:#1B2958; --hi:#FF8D63; --hi-soft:#47281F; --code-bg:#1C2849; --ok:#5FD394;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);padding:64px 16px 72px}
  .wrap{max-width:1040px;margin:0 auto}
  a{color:var(--accent)}
  a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
  .topbar{position:fixed;top:14px;right:14px;z-index:20;display:flex;gap:8px}
  .toggle,.pbtn{display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 .8rem var(--f-body);cursor:pointer;text-decoration:none}
  .toggle:hover,.pbtn:hover{border-color:var(--accent)}
  .pbtn.back{position:fixed;top:14px;left:14px;z-index:20}
  [hidden]{display:none!important}

  /* hero */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center;padding-bottom:32px;border-bottom:1px solid var(--line)}
  .eyebrow{font:600 .75rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.3rem,5.4vw,3.6rem);line-height:1.02;letter-spacing:-.025em;margin:14px 0 12px;text-wrap:balance}
  .hero p{margin:0 0 18px;color:var(--muted);font-size:1.1rem;max-width:60ch}
  .stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font:500 .85rem var(--f-mono)}
  .stats b{color:var(--ink)}
  .figure{width:200px;height:auto}
  .figure .w{stroke:var(--muted);stroke-width:1.1;opacity:.55}
  .figure .hl{stroke:var(--accent);stroke-width:3.6;stroke-linecap:round}
  .figure .n{fill:var(--surface);stroke:var(--ink);stroke-width:1.8}
  .figure .na{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.6}

  /* hub: module cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding-top:28px}
  a.card{display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;text-decoration:none;color:var(--ink);transition:border-color .12s,transform .12s}
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .chip{align-self:flex-start;background:var(--accent);color:var(--surface);border-radius:6px;padding:2px 9px;font:600 .8rem/1.6 var(--f-mono);letter-spacing:.06em}
  .card h2{margin:0;font:700 1.35rem/1.2 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
  .blurb{margin:0;color:var(--muted);font-size:.95rem}
  .empty{color:var(--muted)}

  /* module page: chapter dropdowns */
  .chapters{display:grid;gap:12px;padding-top:28px}
  details.chapter{background:var(--surface);border:1px solid var(--line);border-radius:14px}
  details.chapter[open]{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  details.chapter summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding:16px 20px}
  details.chapter summary::-webkit-details-marker{display:none}
  details.chapter summary::after{content:"";margin-left:auto;align-self:center;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
  details.chapter[open] summary::after{transform:rotate(-135deg)}
  .cl{font:600 .75rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
  .ct{font:700 1.15rem/1.3 var(--f-display)}
  .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;padding:4px 20px 20px;border-top:1px solid var(--line);margin:0 20px;padding-inline:0;padding-top:16px}
  .group h3{margin:0 0 8px;font:600 .7rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .group ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  .res{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.95rem}
  .res:hover{background:var(--accent-soft);color:var(--accent)}
  .ft{flex-shrink:0;font:600 .62rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;min-width:3.4em;text-align:center}
  .res.practice .ft{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 45%,transparent)}
  .res.lesson .ft{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .badge{margin-left:auto;flex-shrink:0;font:500 .72rem var(--f-mono);color:var(--hi);border:1px solid currentColor;border-radius:999px;padding:0 7px}
  .none{color:var(--muted);font-style:italic;font-size:.88rem;padding:7px 10px}

  /* upload page */
  .up{display:grid;gap:18px;padding-top:28px;max-width:760px}
  .up fieldset{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 20px 18px;margin:0;display:grid;gap:12px;min-width:0}
  .up legend{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 6px}
  .up .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .up label.f{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
  .up input[type=text],.up select{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
  .up input[type=text]:focus,.up select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .kinds{display:flex;flex-wrap:wrap;gap:8px}
  .kinds label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;background:var(--bg)}
  .kinds label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .kinds input{accent-color:var(--accent);margin:0}
  .drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);cursor:pointer}
  .drop.over,.drop:hover{border-color:var(--accent);color:var(--accent)}
  .drop input{display:block;margin:10px auto 0;max-width:100%}
  .btn{font:600 .95rem var(--f-body);background:var(--accent);color:var(--surface);border:0;border-radius:999px;padding:10px 24px;cursor:pointer;justify-self:start}
  .btn:disabled{opacity:.45;cursor:default}
  .hint{font-size:.85rem;color:var(--muted);margin:0}
  .err{color:var(--hi);font-size:.92rem;margin:0}
  .jobs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .jobs li{background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:10px 14px;display:grid;gap:3px;overflow-wrap:anywhere}
  .jobs li.ok{border-left-color:var(--ok)}
  .jobs li.bad{border-left-color:var(--hi)}
  .jobs .st{font:500 .82rem var(--f-mono);color:var(--muted)}
  .jobs li.ok .st{color:var(--ok)}
  .jobs li.bad .st{color:var(--hi)}
  .jobs ul{margin:4px 0 0;padding-left:1.2em;color:var(--hi);font-size:.88rem}
  .manage{display:grid;gap:10px;padding-top:30px}
  #tree{display:grid;gap:12px}
  .manage h2{margin:0;font:700 1.4rem var(--f-display)}
  details.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px}
  details.mod>summary{cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:600}
  .tree-ch{border-top:1px solid var(--line);padding:10px 16px}
  .tree-h{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95rem}
  .tree-ch ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
  .tree-ch li{display:flex;align-items:center;gap:10px;padding:3px 0 3px 10px;font-size:.9rem;overflow-wrap:anywhere;min-width:0}
  .del{margin-left:auto;flex-shrink:0;font:500 .78rem var(--f-body);color:var(--hi);background:none;border:1px solid color-mix(in srgb,var(--hi) 45%,transparent);border-radius:999px;padding:3px 11px;cursor:pointer}
  .del:hover{background:var(--hi-soft)}
  .del:disabled{opacity:.4;cursor:default}

  @media (max-width:600px){
    .hero{grid-template-columns:1fr}
    .figure{width:150px;order:-1}
    .grid{grid-template-columns:minmax(0,1fr)}
  }
</style>
</head>
<body>
<div class="topbar">%%ACTIONS%%<button class="toggle" id="theme-toggle" type="button" aria-label="Toggle light or dark theme">◐ Theme</button></div>
<div class="wrap">
  %%BACK%%
  <header class="hero">
    <div>
      <div class="eyebrow">%%EYEBROW%%</div>
      <h1>%%TITLE%%</h1>
      <p>%%SUB%%</p>
      <div class="stats">%%STATS%%</div>
    </div>
    <svg class="figure" viewBox="0 0 200 150" role="img" aria-label="A small neural network">
      <line class="w" x1="32" y1="38" x2="100" y2="21"/>
      <line class="w" x1="32" y1="38" x2="100" y2="93"/>
      <line class="w" x1="32" y1="38" x2="100" y2="129"/>
      <line class="w" x1="32" y1="75" x2="100" y2="21"/>
      <line class="w" x1="32" y1="75" x2="100" y2="93"/>
      <line class="w" x1="32" y1="75" x2="100" y2="129"/>
      <line class="w" x1="32" y1="112" x2="100" y2="21"/>
      <line class="w" x1="32" y1="112" x2="100" y2="57"/>
      <line class="w" x1="32" y1="112" x2="100" y2="93"/>
      <line class="w" x1="32" y1="112" x2="100" y2="129"/>
      <line class="w" x1="100" y1="21" x2="168" y2="57"/>
      <line class="w" x1="100" y1="21" x2="168" y2="93"/>
      <line class="w" x1="100" y1="57" x2="168" y2="93"/>
      <line class="w" x1="100" y1="93" x2="168" y2="57"/>
      <line class="w" x1="100" y1="93" x2="168" y2="93"/>
      <line class="w" x1="100" y1="129" x2="168" y2="57"/>
      <line class="w" x1="100" y1="129" x2="168" y2="93"/>
      <line class="hl" x1="32" y1="38" x2="100" y2="57"/>
      <line class="hl" x1="32" y1="75" x2="100" y2="57"/>
      <line class="hl" x1="100" y1="57" x2="168" y2="57"/>
      <circle class="n na" cx="32" cy="38" r="11"/>
      <circle class="n na" cx="32" cy="75" r="11"/>
      <circle class="n" cx="32" cy="112" r="11"/>
      <circle class="n" cx="100" cy="21" r="11"/>
      <circle class="n na" cx="100" cy="57" r="11"/>
      <circle class="n" cx="100" cy="93" r="11"/>
      <circle class="n" cx="100" cy="129" r="11"/>
      <circle class="n na" cx="168" cy="57" r="11"/>
      <circle class="n" cx="168" cy="93" r="11"/>
    </svg>
  </header>
%%MAIN%%
</div>
<script>
fetch("/api/summary", { cache: "no-store", credentials: "same-origin" })
  .then(function (r) { if (!r.ok) throw 0; return r.json(); })
  .then(function (counts) {
    var scope = document.body.getAttribute("data-module"), total = 0;
    Object.keys(counts).forEach(function (k) {
      if (!scope || k.indexOf(scope + "/") === 0) total += counts[k];
    });
    var t = document.getElementById("saved-total");
    if (t) t.textContent = total;
    var w = document.getElementById("saved-word");
    if (w) w.textContent = total === 1 ? "answer" : "answers";
    document.querySelectorAll("a[data-key]").forEach(function (a) {
      var n = counts[a.getAttribute("data-key")];
      if (!n) return;
      var b = a.querySelector(".badge");
      b.textContent = n + " saved";
      b.hidden = false;
    });
  })
  .catch(function () {});
</script>
</body>
</html>
